<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="col">
            <div class="row">
    <div class="col-6 mt-3">
        <form method="POST" id="categoriaForm">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" id="btnLogin" type="submit">Agregar categoria</button>
            <p id="mensaje"></p>
        </form>
        <a href="{% url 'ver' %}">Volver</a>
    </div>
        <div class="col-6">
            <h1>Ver categorias</h1>
            <div class="row" id="categorias">
            </div>
        </div>
    </div>
        </div>
    </div>
    <script>
        //Vamos a usar el formulario para hacer un request POST a mi API
        var form = document.getElementById('categoriaForm');
        //En este caso el event es el comportamiento del formulario
        form.addEventListener('submit', function(event){
            //Para evitar que se mande un formulario en este contexto
            event.preventDefault();

            //Obtener los datos del formulario
            let formData = new FormData(this);


            //Convertir los datos a json
            let jsonData = {};
            //Este conexto el valor es el dato del input y la key es el "name"
            formData.forEach((value,key)=> jsonData[key]= value);

            //Enviar datos al servidor usando fetch
            fetch('/categorias/api/post/',{
                method:'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCSRFToken() // la funcion se hara mas adelante

                },
                body: JSON.stringify(jsonData)
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('mensaje').innerText='Registro Exitoso';
            //Repintar los elementos o productos
            cargarProductos();
        })
        .catch(error => console.error('Error:',error));

    });

    //Funcion para obtener el token CSRF
    function getCSRFToken(){
        let cookieValue = null;
        let cookies = document.cookie.split(';');
        for(let i =0; i<cookies.length; i++){
            let cookie = cookies[i].trim();
            if(cookie.startsWith('csrftoken=')){
                cookieValue = cookie.substring('csrftoken='.length,cookie.length);
                break;
            }
        }
        return cookieValue;
    }

    function cargarProductos(){
        fetch('/categorias/api/get/')
            .then(response => response.json())
            .then(data =>{
                let categoriaDiv = document.getElementById('categorias');
                categoriaDiv.innerHTML = "";
                data.forEach(categoria =>{
                    categoriaDiv.innerHTML += 
                    `<div class="card col-3 shadow-sm text-center mb-5">
                <img src="${categoria.imagen}" class="card-img-top img-fluid rounded p-2" alt="${categoria.nombre}" style="width: 200px; margin: 0 auto;">
                <div class="card-body">
                    <h5 class="card-title">${categoria.nombre}</h5>
                </div>
            </div>
    `
                });
            })
            .catch(error => console.error('Error:',error));

    }
</script>
</body>
</html>
