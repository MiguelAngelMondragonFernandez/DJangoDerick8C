<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>


    <title>Document</title>
</head>
<body>
    <div id="spinner" class="spinner-border text-primary">
        <div class="spinner-border text-primary">
            <span class="visually-hidden">Loading...</span>
        </div>
        <span>Cargando...</span>
    </div>

    <div>
        <div class="container visually-hidden" id="formAlumno">
            <div class="col">
                <div class="row">
                    <div class="col-6 mt-3">
                        <h1>Agregar Alumno</h1>
                        <form method="post" id="alumnoForm">
                            <input type="text" id="idAlumno" class="visually-hidden">
                            {{ form.as_p }}
                            <button class="btn btn-primary" id="btn" type="submit">Agregar</button>
                        </form>
                        <div>
                            <p id="mensaje"></p>
                        </div>
                        <a href="{% url 'agregar' %}">Ver Alumnos</a>
                    </div>
                    <div class="col-6 mt-3">
                        <h1>Ver Alumnos</h1>
                        <div class="row" id="alumnos"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>

axios.delete('https://jsonplaceholder.typicode.com/posts/1')
  .then(function (response) {
    console.log('Recurso eliminado exitosamente');
  })
  .catch(function (error) {
    console.error('Error en la solicitud:', error);
  });
        

        const EliminarAlumno = async (id) => {
            await fetch(`/alumnos/api/${id}/`, {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                }
            }).finally(() => {
                cargarAlumnos();
            });
        }

        const Editar = async (id) => {
            await fetch(`/alumnos/api/${id}/`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            }).then(data => data.json()).then(
                data => {
                    document.getElementById('nombre').value = data.nombre;
                    document.getElementById('apellido').value = data.apellido;
                    document.getElementById('edad').value = data.edad;
                    document.getElementById('email').value = data.email;
                    document.getElementById('matricula').value = data.matricula;
                    document.getElementById('idAlumno').value = data.id;
                    document.getElementById('btn').innerText = 'Editar';
                }
            )
        }
        
        const cargarAlumnos = async() => {
            await fetch('/alumnos/api/',{
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
                .then(data => data.json())
                .then(data => {
                    let alumnos = document.getElementById('alumnos');
                    alumnos.innerHTML = '';
                    data.forEach(alumno => {
                        let div = document.createElement('div');
                        div.innerHTML = `
                        <div>
                            <div class="col-6">
                                <h3>${alumno.nombre} ${alumno.apellido}</h3>
                                <p>Edad: ${alumno.edad}</p>
                                <p>Email: ${alumno.email}</p>
                                <p>Matricula: ${alumno.matricula}</p>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-danger" onClick="EliminarAlumno(${alumno.id})">Eliminar</button>
                                <button class="btn btn-warning" onClick="Editar(${alumno.id})">Editar</button>
                            </div>
                        `;
                        alumnos.appendChild(div);
                    });
                    document.getElementById('spinner').classList.add('visually-hidden');
                    document.getElementById('formAlumno').classList.remove('visually-hidden');
                });
        }
        document.addEventListener('DOMContentLoaded', () => {

            cargarAlumnos();
        });
        document.getElementById('alumnoForm').addEventListener('submit', async () => {
            event.preventDefault();
            let formData = new FormData(document.getElementById('alumnoForm'));
            const data = {
                id: formData.get('idAlumno'),
                nombre: formData.get('nombre'),
                apellido: formData.get('apellido'),
                edad: formData.get('edad'),
                email: formData.get('email'),
                matricula: formData.get('matricula')
            }
            if(document.getElementById('idAlumno').value){
                await fetch(`/alumnos/api/${document.getElementById('idAlumno').value}/`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                }).then(data => data.json()).then(
                    data => {
                        cargarAlumnos();
                        document.getElementById('mensaje').innerText = data.message;
                        document.getElementById('alumnoForm').reset();
                    }
                )
            } else {
            await fetch('/alumnos/api/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            }).then(data => data.json()).then(                
                data => {
                    cargarAlumnos();
                    document.getElementById('mensaje').innerText = data.message;
                    document.getElementById('alumnoForm').reset();
                }
            )
        }
        })
    </script>

</body>
</html>
