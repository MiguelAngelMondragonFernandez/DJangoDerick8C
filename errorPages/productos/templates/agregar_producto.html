<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
        <style>
            #page {
                opacity: 0;
                animation: fadeIn 2s forwards;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                }
                to {
                    opacity: 1;
                }
            }
        </style>
</head>

<body id="page">    
    <div>
        <div id="spinner" class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        <span>Cargando...</span>
        </div>
    </div>

    <div id="pagina" class="container">
        <div class="col">
            <div class="row">
                <!-- El formulario -->
                <div class="col-6 mt-3">
                    <h1>Agregar producto</h1>
                    <form method="post" id="productoForm">
                        {% csrf_token %} {{ form.as_p }}
                        <button class="btn btn-primary" type="submit">Agregar</button>
                    </form>
                    <div>
                        <p id="mensaje"></p>
                    </div>
                    <a href="{% url 'ver' %}">Ver Productos</a>
                </div>
                <!-- Vista de productos-->
                <div class="col-6 mt-3">
                    <h1>Ver Productos</h1>
                    <div class="row" id="productos"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            cargarProductos();
        });
        //Vamos a usar el formulario para hacer un request POST a mi API
        var form = document.getElementById('productoForm');
        //En este caso el event es el comportamiento del formulario
        form.addEventListener('submit', function (event) {
            //Para evitar que se mande un formulario en este contexto
            event.preventDefault();

            //Obtener los datos del formulario
            let formData = new FormData(this);


            //Convertir los datos a json
            let jsonData = {};
            //Este conexto el valor es el dato del input y la key es el "name"
            formData.forEach((value, key) => jsonData[key] = value);

            //Enviar datos al servidor usando fetch
            fetch('/productos/api/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(jsonData)
            })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('mensaje').innerText = 'Registro Exitoso';
                    //Repintar los elementos o productos
                    cargarProductos();
                })
                .catch(error => console.error('Error:', error));

        });

        function cargarProductos() {
            fetch('/productos/api/')
                .then(response => response.json())
                .then(data => {                  
                    let productosDiv = document.getElementById('productos');
                    productosDiv.innerHTML = "";
                    data.forEach(producto => {                        
                        productosDiv.innerHTML +=
                            `<div class='col-3'>
                            <strong>${producto.nombre}</strong>-
                            $${producto.precio} <br> 
                            <img src="${producto.imagen}" width="100"/>
                            <p>${producto.categoria}</p>
                            </div>`
                    });
                })
                .catch(error => console.error('Error:', error));
                document.getElementById('spinner').classList.add('visually-hidden');
                document.getElementById('pagina').classList.remove('visually-hidden');
        }
    </script>
</body>

</html>
